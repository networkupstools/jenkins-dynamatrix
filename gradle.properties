# Disable Kotlin compiler daemon - https://discuss.kotlinlang.org/t/solved-disable-kotlin-compiler-process-keepalive/2622
# This limits the Gradle daemon's heap, not the memory used by test or agent JVMs.
org.gradle.jvmargs=-XX:+UseG1GC -Xmx4096m -Xms256m -Dkotlin.compiler.execution.strategy="in-process" --add-opens java.base/java.lang=ALL-UNNAMED --add-opens java.base/java.io=ALL-UNNAMED --add-opens java.base/java.util=ALL-UNNAMED -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.warning.mode=fail

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
