# Disable Kotlin compiler daemon - https://discuss.kotlinlang.org/t/solved-disable-kotlin-compiler-process-keepalive/2622
# NOTE: "add-opens" is supposed to be a short-term workaround
#  for use of reflection in older Jenkins core or plugin code
#  which is blocked since JDK 21.
# NOTE: `-Xmx` here limits the Gradle daemon's heap,
# not the memory used by test or agent JVMs.
org.gradle.jvmargs=-XX:+UseG1GC -Xmx4096m -Xms256m -Dkotlin.compiler.execution.strategy="in-process" --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.warning.mode=fail

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
netbeans.hint.jdkPlatform=JDK_25
